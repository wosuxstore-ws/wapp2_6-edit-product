plugins {
    id 'com.android.application'
}

// ---- QR scanner secret key (same value as secret_key_hex in the QR Maker's config.php) -----------
// Order: environment variable QR_SECRET_KEY_HEX  ->  gradle property  ->  the fallback below.
// If your GitHub repo is PUBLIC, don't leave the real key in the fallback: delete it here and add a
// repository secret named QR_SECRET_KEY_HEX instead (the workflow already passes it in).
def qrKey = (System.getenv('QR_SECRET_KEY_HEX') ?: (project.findProperty('QR_SECRET_KEY_HEX') ?: '')).toString().trim()
if (qrKey.isEmpty()) {
    qrKey = 'af2fabdc338d12f29f39f8a2d07608d1ff55970319ec7d07d33865120bc079c5'
}
if (!(qrKey ==~ /[0-9a-fA-F]{64}/)) {
    throw new GradleException('QR_SECRET_KEY_HEX must be exactly 64 hex characters (copy secret_key_hex from config.php).')
}

android {
    namespace 'com.wl.orders'
    compileSdk 34

    defaultConfig {
        applicationId "com.wl.orders"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'QR_SECRET_KEY_HEX', "\"${qrKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing. The keystore is NOT stored in the repo: it is read from
    // app/release.keystore (created by CI from GitHub secrets, or placed there by you)
    // and the passwords come from environment variables. See README "Signed release APK".
    def releaseKeystore = file("release.keystore")

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.android.volley:volley:1.2.1'

    // QR scanner (bottom bar centre button): camera preview + offline QR reading
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"
    implementation 'com.google.guava:guava:33.2.1-android'   // ListenableFuture used by CameraX
    implementation 'com.google.mlkit:barcode-scanning:17.3.0' // model is bundled, works offline
}
